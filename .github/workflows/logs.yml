name: Diagnóstico (errores y reglas)
on: workflow_dispatch
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Reglas de Firestore publicadas
        run: |
          P=personal-balance-dccca; T=$(gcloud auth print-access-token); H=(-H "Authorization: Bearer $T" -H "x-goog-user-project: $P")
          R=$(curl -s "${H[@]}" "https://firebaserules.googleapis.com/v1/projects/$P/releases/cloud.firestore" | jq -r .rulesetName)
          echo "ruleset: $R"
          curl -s "${H[@]}" "https://firebaserules.googleapis.com/v1/$R" | jq -r '.source.files[0].content' | gzip -c | base64 -w0; echo
      - name: Errores de la última hora (sin correos)
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="personal-balance-web" AND (severity>=ERROR OR textPayload:"Traceback")' \
            --project personal-balance-dccca --freshness 1h --limit 40 --format 'value(textPayload)' \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<correo>/g' | tac | tail -40
