name: Ver errores del servidor (diagnóstico)
on: workflow_dispatch
jobs:
  logs:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
      - name: Errores de la última hora (sin correos)
        run: |
          gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="personal-balance-web" AND (severity>=ERROR OR textPayload:"Traceback" OR textPayload:"Error")' \
            --project personal-balance-dccca --freshness 1h --limit 80 --format 'value(textPayload)' \
            | sed -E 's/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+/<correo>/g' | tac
