<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Personal Balance">
<meta name="theme-color" content="#2f6f5e">
<title>Personal Balance</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--text:#1d1d1f;--muted:#6b6b70;--line:#e4e2dc;
  --accent:#2f6f5e;--accent-soft:#e3efe9;--warn:#b45309;--warn-soft:#fdf1e2;
  --bad:#b42318;--bad-soft:#fdecea;--ok:#1f7a4d;--ok-soft:#e5f4ec;
  --c1:#2f6f5e;--c2:#d97a3a;--c3:#4a6fa5;--c4:#b5487a;--c5:#8a7a2e;--c6:#6b5ba8;--c7:#3d9aa6;--c8:#9b4a3a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141416;--card:#1e1e21;--text:#ececef;--muted:#9a9aa2;--line:#2e2e33;
  --accent:#6cc3a6;--accent-soft:#1d3029;--warn:#f0a35e;--warn-soft:#33261a;
  --bad:#f08a80;--bad-soft:#361d1b;--ok:#6cc39a;--ok-soft:#1b3026;
  --c1:#6cc3a6;--c2:#f0a35e;--c3:#82a6dc;--c4:#e283b0;--c5:#cdbb62;--c6:#a99ae0;--c7:#6cc9d4;--c8:#d98a78;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141416;--card:#1e1e21;--text:#ececef;--muted:#9a9aa2;--line:#2e2e33;
  --accent:#6cc3a6;--accent-soft:#1d3029;--warn:#f0a35e;--warn-soft:#33261a;
  --bad:#f08a80;--bad-soft:#361d1b;--ok:#6cc39a;--ok-soft:#1b3026;
  --c1:#6cc3a6;--c2:#f0a35e;--c3:#82a6dc;--c4:#e283b0;--c5:#cdbb62;--c6:#a99ae0;--c7:#6cc9d4;--c8:#d98a78;color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header h1{font-size:19px;margin:0;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--muted);font:inherit;cursor:pointer}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{max-width:1100px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sync{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:600}
.kpi .lbl{color:var(--muted);font-size:13px}
.kpi .val{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .sub{color:var(--muted);font-size:13px;margin-top:2px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right}
tr.paid td{color:var(--muted)}
tr.next td{background:var(--accent-soft)}
tfoot td{font-weight:650;border-bottom:0}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
:root[data-theme="dark"] .btn:not(.ghost):not(.danger){color:#10201b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.danger){color:#10201b}}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:4px 9px;font-size:13px}
.icon{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:14px}
.icon:hover{background:var(--bg);color:var(--text)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--bg);color:var(--muted)}
.bar{height:10px;background:var(--bg);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.alert{border-radius:10px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.legend li{display:flex;align-items:center;gap:8px;font-size:14px}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:none}
.legend .amt{margin-left:auto;font-variant-numeric:tabular-nums}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut-wrap svg{flex:none}
.donut-wrap .legend{flex:1;min-width:200px}
.upc{list-style:none;padding:0;margin:0}
.upc li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.upc li:last-child{border-bottom:0}
.upc .d{width:52px;text-align:center;flex:none;border-radius:8px;background:var(--bg);padding:4px 0;line-height:1.1}
.upc .d b{display:block;font-size:18px}
.upc .d span{font-size:11px;color:var(--muted);text-transform:uppercase}
.upc .amt{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.loan-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.loan-stats div .lbl{font-size:12px;color:var(--muted)}
.loan-stats div .v{font-weight:600;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--accent);font-weight:600;margin-top:6px}
.tbl-wrap{overflow-x:auto}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:20px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 14px}
label.f{display:block;margin-bottom:10px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hidden{display:none!important}
.chart svg text{fill:var(--muted);font-size:11px}
#debtchart{position:relative}
.chart svg .hit{cursor:default}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.15);font-size:13px;min-width:190px;font-variant-numeric:tabular-nums}
.tip .tip-tot{font-size:15px;font-weight:650;margin:2px 0 4px}
.tip .tip-row{display:flex;align-items:center;gap:6px;color:var(--muted)}
.tip .tip-row span:last-child{margin-left:auto;color:var(--text)}
.tip .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
header .avatar{margin-left:4px}
.avatar{width:36px;height:36px;border-radius:50%;border:0;padding:0;overflow:hidden;background:var(--accent-soft);color:var(--accent);font:700 17px/1 inherit;display:grid;place-items:center;cursor:pointer;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.big{width:96px;height:96px;font-size:44px;cursor:default}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:grid;place-items:center;padding:20px}
.auth-card{width:min(400px,100%)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:14px}
.seg button{border:0;background:none;padding:8px;border-radius:8px;font:inherit;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:2px 0 8px}
.okm{color:var(--ok);font-size:13px;min-height:18px}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 14px}
.icons button{font-size:24px;padding:8px 0;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer}
.icons button.on{border-color:var(--accent);background:var(--accent-soft)}
.btn.wide{width:100%}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:4px 0}
#crop-vp{position:relative;width:260px;height:260px;margin:0 auto 14px;overflow:hidden;background:#000;touch-action:none;cursor:grab;border-radius:8px}
#crop-vp img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none}
#crop-vp .ring{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 400px rgba(0,0,0,.6);border:2px solid #fff;pointer-events:none}
#crop-z{width:100%}
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:20px;text-align:center}
@media (max-width:600px){
  header{flex-wrap:nowrap;gap:10px}header h1{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:17px}.sync{font-size:11px}
  .kpi .val{font-size:20px}th,td{padding:7px 4px}.hide-sm{display:none}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px}
  nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);gap:0;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav button{padding:10px 4px;font-size:13px}
  main{padding-bottom:calc(90px + env(safe-area-inset-bottom,0px))}
}
</style>
</head>
<body>
<div id="lock" class="hidden"><div class="auth-card">
  <img src="icon-180.png" width="162" height="162" alt="" style="border-radius:32px;box-shadow:0 8px 24px rgba(0,0,0,.25)"><h1 style="margin:16px 0 22px;font-size:22px" data-i="l_locked"></h1>
  <button class="btn wide" id="l-unlock" data-i="l_unlock"></button>
  <div class="err" id="l-err" style="margin-top:10px"></div>
  <button class="linkbtn" id="l-out" data-i="p_signout"></button>
</div></div>
<div id="auth">
 <div class="auth-card">
  <div style="text-align:center;margin-bottom:18px"><img src="icon-180.png" width="162" height="162" alt="" style="border-radius:32px;box-shadow:0 8px 24px rgba(0,0,0,.25)"><h1 style="margin:14px 0 4px;font-size:24px">Personal Balance</h1><p class="muted small" data-i="a_intro"></p></div>
  <div id="auth-load" class="card" style="text-align:center"><span data-i="a_loading"></span></div>
  <div id="auth-off" class="card hidden" style="text-align:center"><p data-i="a_offline"></p><button class="btn" id="a-retry" data-i="a_retry"></button></div>
  <div id="auth-box" class="card hidden">
    <div class="seg"><button type="button" id="seg-login" class="on" data-i="a_login"></button><button type="button" id="seg-reg" data-i="a_register"></button></div>
    <form id="auth-form" novalidate>
      <label class="f" id="a-name-wrap"><span data-i="a_name"></span><input id="a-name" autocomplete="name"></label>
      <label class="f"><span data-i="a_email"></span><input id="a-email" type="email" autocomplete="email" inputmode="email" autocapitalize="off" autocorrect="off"></label>
      <label class="f"><span data-i="a_pass"></span><input id="a-pass" type="password" autocomplete="current-password"></label>
      <label class="small" style="display:flex;gap:8px;align-items:center;margin:2px 0 10px;cursor:pointer"><input type="checkbox" id="a-remember" checked><span data-i="a_remember"></span></label>
      <p class="muted small hidden" id="a-hint" data-i="a_pass_hint" style="margin:-4px 0 8px"></p>
      <div class="err" id="auth-err"></div>
      <button class="btn wide" id="a-submit" type="submit"></button>
      <div style="text-align:center;margin-top:6px"><button type="button" class="linkbtn" id="a-forgot" data-i="a_forgot"></button></div>
    </form>
    <div class="muted small" style="text-align:center;margin:10px 0" data-i="a_or"></div>
    <button class="btn ghost wide" id="a-google" type="button"><b style="color:#4285f4">G</b>&nbsp; <span data-i="a_google"></span></button>
  </div>
  <p style="text-align:center;margin-top:14px"><select id="lang-a" style="padding:6px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);font:inherit"><option value="es">Español</option><option value="en">English</option><option value="bg">Български</option></select></p>
 </div>
</div>
<header>
  <h1>💶 Personal Balance <span class="sync" id="sync"></span></h1>
  <nav id="nav">
    <button data-tab="resumen" class="on" data-i="tab_resumen"></button>
    <button data-tab="gastos" data-i="tab_gastos"></button>
    <button data-tab="prestamos" data-i="tab_prestamos"></button>
    <button data-tab="datos" data-i="tab_datos"></button>
  </nav>
  <button class="avatar" id="avatar" data-it="tab_perfil"></button>
</header>
<main>
  <div id="alerts"></div>

  <!-- RESUMEN -->
  <section id="tab-resumen">
    <div class="grid kpis">
      <div class="card kpi"><div class="lbl" data-i="k_mes"></div><div class="val" id="k-mes"></div><div class="sub" id="k-mes-sub"></div></div>
      <div class="card kpi"><div class="lbl" data-i="k_anio"></div><div class="val" id="k-anio"></div><div class="sub" data-i="k_anio_sub"></div></div>
      <div class="card kpi"><div class="lbl" data-i="k_deuda"></div><div class="val" id="k-deuda"></div><div class="sub" id="k-deuda-sub"></div></div>
      <div class="card kpi"><div class="lbl" data-i="k_fin"></div><div class="val" id="k-fin"></div><div class="sub" id="k-fin-sub"></div></div>
    </div>
    <div class="grid two" style="margin-top:16px">
      <div class="card"><h2 data-i="h_donut"></h2><div class="donut-wrap" id="donut"></div></div>
      <div class="card"><h2 data-i="h_pend"></h2><ul class="upc" id="upcoming"></ul></div>
    </div>
    <div class="card" style="margin-top:16px">
      <div class="row" style="margin-bottom:10px"><h2 style="margin:0" data-i="h_mes"></h2>
        <button class="icon" id="mes-prev" data-it="mes_prev">◀</button><b id="mes-lbl" style="min-width:120px;text-align:center"></b><button class="icon" id="mes-next" data-it="mes_next">▶</button>
        <span class="spacer"></span><span class="small" id="mes-resumen"></span></div>
      <div class="bar" style="margin-bottom:10px"><i id="mes-bar"></i></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th style="width:60px" data-i="th_pagado"></th><th data-i="th_concepto"></th><th data-i="th_dia_pago"></th><th class="n" data-i="th_importe"></th><th class="hide-sm" data-i="th_estado"></th></tr></thead>
        <tbody id="mes-body"></tbody>
        <tfoot><tr><td></td><td data-i="total_mes"></td><td></td><td class="n" id="mes-total"></td><td class="hide-sm"></td></tr></tfoot>
      </table></div>
      <p class="muted small" data-i="mes_nota"></p>
    </div>
    <div class="card chart" style="margin-top:16px">
      <h2 data-i="h_deuda"></h2>
      <div id="debtchart"></div>
    </div>
  </section>

  <!-- GASTOS -->
  <section id="tab-gastos" class="hidden">
    <div class="card">
      <div class="row" style="margin-bottom:10px"><h2 style="margin:0" data-i="h_fijos"></h2><span class="spacer"></span><button class="btn" id="add-gasto" data-i="add_gasto"></button></div>
      <div class="tbl-wrap"><table>
        <thead><tr><th data-i="th_concepto"></th><th class="hide-sm" data-i="th_categoria"></th><th class="n hide-sm" data-i="th_dia_cobro"></th><th class="n" data-i="th_importe"></th><th class="n hide-sm" data-i="th_pct"></th><th class="hide-sm" data-i="th_hasta"></th><th></th></tr></thead>
        <tbody id="gastos-body"></tbody>
        <tfoot><tr><td data-i="k_mes"></td><td class="hide-sm"></td><td class="hide-sm"></td><td class="n" id="g-total"></td><td class="n hide-sm">100 %</td><td class="hide-sm"></td><td></td></tr>
        <tr><td class="muted" data-i="k_anio"></td><td class="hide-sm"></td><td class="hide-sm"></td><td class="n muted" id="g-anual"></td><td class="hide-sm"></td><td class="hide-sm"></td><td></td></tr></tfoot>
      </table></div>
      <p class="muted small" data-i="gastos_nota"></p>
    </div>
  </section>

  <!-- PRESTAMOS -->
  <section id="tab-prestamos" class="hidden">
    <div class="row" style="margin-bottom:14px"><span class="muted small" data-i="pres_nota"></span><span class="spacer"></span><button class="btn" id="add-loan" data-i="add_loan"></button></div>
    <div class="card" style="margin-bottom:16px" id="loans-total"></div>
    <div class="grid" id="loans"></div>
  </section>

  <!-- DATOS -->
  <section id="tab-datos" class="hidden">
    <div class="grid two">
      <div class="card">
        <h2 data-i="h_donde"></h2>
        <p id="donde"></p>
        <p class="muted small" data-i="datos_aviso"></p>
        <p class="small" id="last-backup"></p>
        <div class="row"><button class="btn" id="pegar" data-i="btn_pegar"></button>
        <label class="btn ghost" style="cursor:pointer"><span data-i="btn_cargar"></span><input type="file" id="imp" accept=".json,application/json" hidden></label>
        <button class="btn ghost" id="exp" data-i="btn_exp"></button></div>
        <p class="muted small" style="margin-top:16px" data-i="reset_nota"></p>
        <button class="btn danger" id="reset" data-i="btn_reset"></button>
      </div>
    </div>
  </section>

  <!-- PERFIL -->
  <section id="tab-perfil" class="hidden">
    <div class="grid two">
      <div class="card">
        <h2 data-i="p_title"></h2>
        <div class="row" style="gap:16px;margin-bottom:12px">
          <div class="avatar big" id="p-avatar"></div>
          <div>
            <label class="btn ghost sm" style="cursor:pointer;display:inline-block"><span data-i="p_change_photo"></span><input type="file" id="p-file" accept="image/*" hidden></label>
            <button class="btn ghost sm" id="p-photo-del" data-i="p_remove_photo"></button>
          </div>
        </div>
        <div class="small muted" data-i="p_icon"></div>
        <div class="icons" id="p-icons"></div>
        <p class="muted small" style="margin-top:-8px" data-i="p_icon_note"></p>
        <label class="f"><span data-i="a_name"></span><input id="p-name" autocomplete="name"></label>
        <div class="small"><span class="muted" data-i="p_email"></span>: <b id="p-email"></b></div>
        <div class="small" style="margin:4px 0 8px"><span id="p-verif"></span> <button class="linkbtn small" id="p-resend" data-i="p_resend"></button></div>
        <div class="okm" id="p-msg"></div>
      </div>
      <div>
        <div class="card" style="margin-bottom:16px">
          <h2 data-i="h_ajustes"></h2>
          <label class="f"><span data-i="lbl_tema"></span>
            <select id="theme"><option value="" data-i="tema_auto"></option><option value="light" data-i="tema_claro"></option><option value="dark" data-i="tema_oscuro"></option></select>
          </label>
          <label class="f"><span data-i="lbl_idioma"></span>
            <select id="lang"><option value="es">Español</option><option value="en">English</option><option value="bg">Български</option></select>
          </label>
        </div>

const LANGS={es:{loc:'es-ES',dec:',',sep:'/'},en:{loc:'en-GB',dec:'.',sep:'/'},bg:{loc:'bg-BG',dec:',',sep:'.'}};
const IDX={es:0,en:1,bg:2};
let lang='es';try{const v=localStorage.getItem('mis-gastos-lang');if(LANGS[v])lang=v}catch(e){}
const t=(k,p)=>{const r=TR[k];let s=r?r[IDX[lang]]:k;return p?s.replace(/\{(\w+)\}/g,(m,x)=>x in p?p[x]:m):s};
let eur,MES;
const mkFmt=()=>{eur=new Intl.NumberFormat(LANGS[lang].loc,{style:'currency',currency:'EUR',useGrouping:'always'});MES=t('meses_c').split('|')};
mkFmt();
const dec=s=>String(s).replace('.',LANGS[lang].dec);
const money=v=>eur.format(+v||0);
const r2=v=>Math.round((+v||0)*100)/100;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmtD=s=>{if(!s)return'';const[y,m,d]=s.split('-');const p=LANGS[lang].sep;return d+p+m+p+y};
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayISO=()=>iso(new Date());
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};

function addMonths(isoStr,k,day){const d=parse(isoStr);const t=new Date(d.getFullYear(),d.getMonth()+k,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day??d.getDate(),last));return iso(t)}

/* ---------- Datos iniciales ---------- */
function seed(){return{version:1,gastos:[],prestamos:[]}}

let S=seed(),curUid=null,P={nombre:'',foto:'',icono:'',email:'',verified:false},mesOff=0;
const keyOf=u=>KEY+'-'+u,tsKey=u=>KEY+'-ts-'+u;
const save=()=>{if(curUid){store.set(keyOf(curUid),JSON.stringify(S));store.set(tsKey(curUid),new Date().toISOString())}render();pushRemote()};

/* ---------- Cálculos ---------- */
const isPaid=c=>c.pagada===true||(c.pagada!==false&&c.fecha<=todayISO());
const sorted=l=>[...l.cuotas].sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
function loanStats(l){
  const cs=sorted(l);const paid=cs.filter(isPaid),pend=cs.filter(c=>!isPaid(c));
  const sum=(a,k)=>r2(a.reduce((s,c)=>s+(+c[k]||0),0));
  const next=pend[0]||null;
  const overdue=pend.filter(c=>c.fecha<todayISO());
  return{cs,n:cs.length,nPaid:paid.length,nPend:pend.length,total:sum(cs,'cuota'),intereses:sum(cs,'intereses'),
    pagado:sum(paid,'cuota'),pendiente:sum(pend,'cuota'),capital:sum(pend,'amortizacion'),intPend:sum(pend,'intereses'),
    next,overdue,fin:cs.length?cs[cs.length-1].fecha:null,inicio:cs.length?cs[0].fecha:null};
}
const totalMes=()=>r2(S.gastos.reduce((s,g)=>s+(+g.importe||0),0));
const loanById=id=>S.prestamos.find(l=>l.id===id);

/* ---------- Render ---------- */
const $=s=>document.querySelector(s);
function render(){renderResumen();renderGastos();renderLoans();renderAlerts();renderDatos();renderProfile()}

function renderAlerts(){
  const out=[];
  S.prestamos.forEach(l=>{const st=loanStats(l);
    if(st.overdue.length)out.push(`<div class="alert bad">⚠️ <div>${t('al_overdue',{name:esc(l.nombre),n:st.overdue.length,date:fmtD(st.overdue[0].fecha)})}</div></div>`);
  });
  const soon=upcoming(7);
  if(soon.length)out.push(`<div class="alert warn">🔔 <div>${t('al_soon')} ${soon.map(u=>t('al_soon_item',{name:esc(u.nombre),amt:money(u.importe),date:fmtD(u.fecha)})).join(' · ')}</div></div>`);
  if(!S.gastos.length&&!S.prestamos.length)out.unshift('<div class="alert info"><div>'+t('welcome')+'</div></div>');
  $('#alerts').innerHTML=out.join('');
}

function upcoming(days){
  const t=todayISO();const lim=iso(new Date(Date.now()+days*864e5));const items=[];
  const linked=new Set(S.prestamos.map(l=>l.id));
  S.prestamos.forEach(l=>sorted(l).forEach(c=>{if(!isPaid(c)&&c.fecha<=lim)items.push({fecha:c.fecha,nombre:l.nombre,importe:c.cuota,tipo:c.fecha<t?'vencido':'préstamo',nota:c.nota})}));
  S.gastos.forEach(g=>{if(!g.dia||(g.prestamoId&&linked.has(g.prestamoId)))return;
    const now=new Date();for(let k=0;k<3;k++){const f=addMonths(iso(new Date(now.getFullYear(),now.getMonth(),1)),k,+g.dia);if(f>=t&&f<=lim)items.push({fecha:f,nombre:g.concepto,importe:g.importe,tipo:'gasto'})}});
  return items.sort((a,b)=>a.fecha<b.fecha?-1:1);
}

function renderResumen(){
  const tm=totalMes();$('#k-mes').textContent=money(tm);$('#k-mes-sub').textContent=t('gastos_n',{n:S.gastos.length});
  $('#k-anio').textContent=money(tm*12);
  let pend=0,cap=0,fin=null,paid=0;S.prestamos.forEach(l=>{const s=loanStats(l);pend+=s.pendiente;cap+=s.capital;paid+=s.pagado;if(s.fin&&(!fin||s.fin>fin))fin=s.fin});
  $('#k-deuda').textContent=money(pend);$('#k-deuda-sub').textContent=t('ya_pagado',{paid:money(paid),cap:money(cap)});
  $('#k-fin').textContent=fin?fmtD(fin):'—';
  if(fin){const d=parse(fin),n=new Date();const m=(d.getFullYear()-n.getFullYear())*12+d.getMonth()-n.getMonth();$('#k-fin-sub').textContent=m>0?t('dentro',{m}):t('terminado_k')}else $('#k-fin-sub').textContent=''
  // Donut
  const items=S.gastos.filter(g=>+g.importe>0).sort((a,b)=>b.importe-a.importe);
  const R=70,r=44,C=90;let a0=-Math.PI/2,svg='';
  items.forEach((g,i)=>{const frac=g.importe/tm;const a1=a0+frac*2*Math.PI;const large=frac>.5?1:0;
    const p=(a,rad)=>[C+rad*Math.cos(a),C+rad*Math.sin(a)];
    if(frac>=.9999){svg+=`<circle cx="${C}" cy="${C}" r="${(R+r)/2}" fill="none" stroke="var(--c${i%8+1})" stroke-width="${R-r}"/>`}
    else{const[x1,y1]=p(a0,R),[x2,y2]=p(a1,R),[x3,y3]=p(a1,r),[x4,y4]=p(a0,r);
    svg+=`<path d="M${x1} ${y1}A${R} ${R} 0 ${large} 1 ${x2} ${y2}L${x3} ${y3}A${r} ${r} 0 ${large} 0 ${x4} ${y4}Z" fill="var(--c${i%8+1})" stroke="var(--card)" stroke-width="2"><title>${esc(g.concepto)}: ${money(g.importe)}</title></path>`}
    a0=a1});
  svg+=`<text x="${C}" y="${C-4}" text-anchor="middle" style="font-size:12px;fill:var(--muted)">${t('al_mes')}</text><text x="${C}" y="${C+14}" text-anchor="middle" style="font-size:15px;font-weight:650;fill:var(--text)">${money(tm)}</text>`;
  $('#donut').innerHTML=`<svg width="180" height="180" viewBox="0 0 180 180" role="img" aria-label="${t('aria_donut')}">${svg}</svg><ul class="legend">${items.map((g,i)=>`<li><span class="sw" style="background:var(--c${i%8+1})"></span>${esc(g.concepto)}<span class="amt">${money(g.importe)} <span class="muted small">${dec((g.importe/tm*100).toFixed(1))} %</span></span></li>`).join('')}</ul>`;
  // Próximos pagos
  const up=mesItems(0).items.filter(i=>!i.pagado);const t0=todayISO();
  $('#upcoming').innerHTML=up.length?up.map(u=>{
    if(!u.fecha)return`<li><div class="d"><b>—</b><span>${t('sin_dia')}</span></div><div>${esc(u.concepto)}<div><span class="pill mute">${t('sin_dia_pago')}</span></div></div><span class="amt">${money(u.importe)}</span></li>`;
    const d=parse(u.fecha);const days=Math.round((d-parse(t0))/864e5);
    const pill=days<0?`<span class="pill bad">${t('vencido')}</span>`:days===0?`<span class="pill warn">${t('hoy')}</span>`:days<=7?`<span class="pill warn">${t('en_d',{d:days})}</span>`:`<span class="pill mute">${t('en_d',{d:days})}</span>`;
    return`<li><div class="d"><b>${d.getDate()}</b><span>${MES[d.getMonth()]}</span></div><div>${esc(u.concepto)}<div>${pill}</div></div><span class="amt">${money(u.importe)}</span></li>`}).join('')+`<li><b>${t('total_pend')}</b><span class="amt">${money(up.reduce((a,u)=>a+u.importe,0))}</span></li>`:`<li class="muted">${t('all_done')}</li>`;
  renderMes();
  renderDebtChart();
}

/* ---------- Gastos del mes ---------- */
const mesKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
function mesItems(off=mesOff){
  const now=new Date();const m0=new Date(now.getFullYear(),now.getMonth()+off,1);const mk=mesKey(m0);const t=todayISO();
  const items=[];
  S.gastos.forEach(g=>{
    const l=g.prestamoId&&loanById(g.prestamoId);
    if(l){const cs=l.cuotas.filter(c=>c.fecha.slice(0,7)===mk).sort((a,b)=>a.fecha<b.fecha?-1:1);
      if(!cs.length)return; // préstamo sin cuota este mes
      cs.forEach(c=>items.push({tipo:'cuota',ref:l.id+'|'+c.id,concepto:g.concepto+(c.nota?' ('+c.nota+')':''),fecha:c.fecha,importe:+c.cuota,pagado:isPaid(c),manual:c.pagada!=null}));return}
    let fecha=null;if(g.dia){const last=new Date(m0.getFullYear(),m0.getMonth()+1,0).getDate();fecha=mk+'-'+pad(Math.min(+g.dia,last))}
    const ov=g.pagos&&g.pagos[mk];const auto=!!fecha&&fecha<=t;
    items.push({tipo:'gasto',ref:g.id+'|'+mk,concepto:g.concepto,fecha,importe:+g.importe,pagado:ov!=null?ov:auto,manual:ov!=null,auto});
  });
  return{m0,items:items.sort((a,b)=>(a.fecha||'9')<(b.fecha||'9')?-1:1)};
}
function renderMes(){
  const{m0,items}=mesItems();const td=todayISO();
  const nombres=t('meses').split('|');
  $('#mes-lbl').textContent=nombres[m0.getMonth()]+' '+m0.getFullYear();
  const tot=r2(items.reduce((a,i)=>a+i.importe,0)),pag=r2(items.filter(i=>i.pagado).reduce((a,i)=>a+i.importe,0));
  $('#mes-total').textContent=money(tot);
  $('#mes-resumen').innerHTML=`<span class="pill ok">${t('pill_pagado',{x:money(pag)})}</span> <span class="pill warn">${t('pill_queda',{x:money(r2(tot-pag))})}</span>`;
  $('#mes-bar').style.width=(tot?pag/tot*100:0).toFixed(1)+'%';
  $('#mes-body').innerHTML=items.map(i=>{
    const est=i.pagado?`<span class="pill ok">${t('st_pagado')}</span>`:!i.fecha?`<span class="pill mute">${t('st_sin_dia')}</span>`:i.fecha<td?`<span class="pill bad">${t('st_vencido')}</span>`:i.fecha===td?`<span class="pill warn">${t('st_hoy')}</span>`:`<span class="pill mute">${t('en_d',{d:Math.round((parse(i.fecha)-parse(td))/864e5)})}</span>`;
    return`<tr class="${i.pagado?'paid':''}"><td><input type="checkbox" data-mp="${i.tipo}|${i.ref}" ${i.pagado?'checked':''}>${i.manual?` <span class="small muted" title="${t('marcado_mano')}">✋</span>`:''}</td><td>${esc(i.concepto)}</td><td>${i.fecha?fmtD(i.fecha):'<span class="muted">—</span>'}</td><td class="n">${money(i.importe)}</td><td class="hide-sm">${est}</td></tr>`}).join('')||`<tr><td colspan="5" class="muted">${t('no_gastos_mes')}</td></tr>`;
}
$('#mes-prev').onclick=()=>{mesOff--;renderMes()};
$('#mes-next').onclick=()=>{mesOff++;renderMes()};
$('#mes-body').addEventListener('change',e=>{const v=e.target.dataset.mp;if(!v)return;const[tipo,a,b]=v.split('|');const on=e.target.checked;
  if(tipo==='cuota'){const c=loanById(a).cuotas.find(x=>x.id===b);const auto=c.fecha<=todayISO();if(on===auto)delete c.pagada;else c.pagada=on}
  else{const g=S.gastos.find(x=>x.id===a);const it=mesItems().items.find(x=>x.ref===a+'|'+b);g.pagos=g.pagos||{};
    if(it&&on===it.auto)delete g.pagos[b];else g.pagos[b]=on}
  save()});

function renderDebtChart(){
  const loans=S.prestamos.filter(l=>l.cuotas.length);if(!loans.length){$('#debtchart').innerHTML=`<p class="muted">${t('sin_prestamos')}</p>`;return}
  let min=null,max=null;loans.forEach(l=>{const s=loanStats(l);if(!min||s.inicio<min)min=s.inicio;if(!max||s.fin>max)max=s.fin});
  const months=[];let d=parse(min);d=new Date(d.getFullYear(),d.getMonth(),1);const end=parse(max);
  while(d<=end){months.push(new Date(d));d=new Date(d.getFullYear(),d.getMonth()+1,1)}
  // pendiente al final de cada mes = suma de cuotas con fecha posterior al fin de mes
  const data=months.map(m=>{const eom=iso(new Date(m.getFullYear(),m.getMonth()+1,0));return loans.map(l=>r2(l.cuotas.filter(c=>c.fecha>eom).reduce((s,c)=>s+ +c.cuota,0)))});
  const top=Math.max(...data.map(v=>v.reduce((a,b)=>a+b,0)),1);
  const W=900,H=240,pl=56,pb=26,pt=10,bw=(W-pl-10)/months.length;
  const step=top>8000?2000:top>4000?1000:500;const yTop=Math.ceil(top/step)*step;
  const y=v=>pt+(H-pt-pb)*(1-v/yTop);let s='';
  for(let v=0;v<=yTop;v+=step){s+=`<line x1="${pl}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${(v/1000).toLocaleString(LANGS[lang].loc)} k€</text>`}
  const now=new Date();
  months.forEach((m,i)=>{let acc=0;const x=pl+i*bw+1.5;
    loans.forEach((l,j)=>{const v=data[i][j];if(v<=0)return;s+=`<rect x="${x}" width="${Math.max(bw-3,1)}" y="${y(acc+v)}" height="${y(acc)-y(acc+v)}" fill="var(--c${j%8+1})"${m.getFullYear()===now.getFullYear()&&m.getMonth()===now.getMonth()?'':' opacity=".75"'}/>`;acc+=v});
    if(m.getMonth()===0||i===0)s+=`<text x="${x}" y="${H-8}">${MES[m.getMonth()]} ${String(m.getFullYear()).slice(2)}</text>`;
    if(m.getFullYear()===now.getFullYear()&&m.getMonth()===now.getMonth())s+=`<text x="${x+bw/2}" y="${pt+8}" text-anchor="middle" style="fill:var(--text);font-weight:600">hoy</text><line x1="${x+bw/2}" x2="${x+bw/2}" y1="${pt+12}" y2="${H-pb}" stroke="var(--text)" stroke-dasharray="3 3" opacity=".5"/>`;
  });
  // zonas invisibles por mes para el tooltip
  months.forEach((m,i)=>{s+=`<rect class="hit" data-i="${i}" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"/>`});
  s+=`<rect id="debt-hl" fill="none" stroke="var(--text)" stroke-width="1.5" rx="1" visibility="hidden" pointer-events="none"/>`;
  const box=$('#debtchart');
  box.innerHTML=`<div class="tip hidden" id="debt-tip"></div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${t('aria_deuda')}">${s}</svg><ul class="legend row" style="display:flex;gap:16px">${loans.map((l,j)=>`<li><span class="sw" style="background:var(--c${j%8+1})"></span>${esc(l.nombre)}</li>`).join('')}</ul><p class="muted small">${t('deuda_nota')}</p>`;
  const tip=$('#debt-tip'),svgEl=box.querySelector('svg');let hl=null;
  const show=(e)=>{const r=e.target.closest('.hit');if(!r){hide();return}const i=+r.dataset.i,m=months[i];
    const tot=r2(data[i].reduce((a,b)=>a+b,0));
    tip.innerHTML=`<b>${MES[m.getMonth()]} ${m.getFullYear()}</b><div class="tip-tot">${t('restante')}: ${money(tot)}</div>`+loans.map((l,j)=>`<div class="tip-row"><span class="sw" style="background:var(--c${j%8+1})"></span>${esc(l.nombre)}<span>${money(data[i][j])}</span></div>`).join('');
    tip.classList.remove('hidden');
    const hlEl=box.querySelector('#debt-hl');if(tot>0){hlEl.setAttribute('x',pl+i*bw+1.5);hlEl.setAttribute('width',Math.max(bw-3,1));hlEl.setAttribute('y',y(tot));hlEl.setAttribute('height',y(0)-y(tot));hlEl.setAttribute('visibility','visible')}else hlEl.setAttribute('visibility','hidden');hl=hlEl;
    const br=box.getBoundingClientRect(),rr=r.getBoundingClientRect();
    let left=rr.right-br.left+10;if(left+tip.offsetWidth>br.width)left=rr.left-br.left-tip.offsetWidth-10;
    const top=(e.clientY||rr.top+rr.height/2)-br.top-tip.offsetHeight/2;
    tip.style.left=Math.max(0,left)+'px';tip.style.top=Math.max(0,Math.min(top,rr.bottom-br.top-tip.offsetHeight))+'px'};
  const hide=()=>{tip.classList.add('hidden');if(hl){hl.setAttribute('visibility','hidden');hl=null}};
  svgEl.addEventListener('mousemove',show);svgEl.addEventListener('click',show);svgEl.addEventListener('mouseleave',hide);
}

        return`<tr class="${p?'paid':''}${nx?' next':''}"><td><input type="checkbox" data-pc="${l.id}|${c.id}" ${p?'checked':''} title="${c.pagada==null?t('auto_fecha'):t('marcado_mano')}">${c.pagada!=null?` <span class="small muted" title="${t('marcado_mano')}">✋</span>`:''}</td><td>${fmtD(c.fecha)}</td><td class="n">${money(c.cuota)}</td><td class="n hide-sm">${money(c.amortizacion)}</td><td class="n hide-sm">${money(c.intereses)}</td><td class="n">${money(c.capitalAntes)}</td><td class="hide-sm small muted">${esc(c.nota||'')}</td><td><button class="icon" data-ec="${l.id}|${c.id}" title="${t('editar')}">✏️</button></td></tr>`}).join('')}

const dG=$('#dlg-gasto'),fG=$('#f-gasto');let editG=null;

  fG.prestamoId.innerHTML=`<option value="">${t('ninguno')}</option>`+S.prestamos.map(l=>`<option value="${l.id}">${esc(l.nombre)}</option>`).join('');

dG.addEventListener('close',()=>{if(dG.returnValue!=='ok')return;
  const v={concepto:fG.concepto.value.trim(),importe:r2(fG.importe.value),dia:fG.dia.value?+fG.dia.value:null,categoria:fG.categoria.value.trim(),prestamoId:fG.prestamoId.value};
  if(editG)Object.assign(editG,v);else S.gastos.push({id:uid(),...v});save()});

const dC=$('#dlg-cuota'),fC=$('#f-cuota');let editC=null;
function openCuota(l,c){editC={l,c};['fecha','cuota','amortizacion','intereses','capitalAntes','nota'].forEach(k=>fC[k].value=c?.[k]??'');$('#cuota-del').classList.toggle('hidden',!c);dC.showModal()}
dC.addEventListener('close',()=>{const{l,c}=editC;
  if(dC.returnValue==='delete'&&c){l.cuotas=l.cuotas.filter(x=>x!==c);return save()}
  if(dC.returnValue!=='ok')return;
  const v={fecha:fC.fecha.value,cuota:r2(fC.cuota.value),amortizacion:r2(fC.amortizacion.value),intereses:r2(fC.intereses.value),capitalAntes:r2(fC.capitalAntes.value),nota:fC.nota.value.trim()};

  if(b.dataset.ec){const[lid,cid]=b.dataset.ec.split('|');const l=loanById(lid);openCuota(l,l.cuotas.find(x=>x.id===cid))}

  if(b.dataset.dl){const l=loanById(b.dataset.dl);ask(t('ask_borrar_loan',{n:l.nombre}),t('ask_borrar_loan_m'),t('borrar'),false,true).then(ok=>{if(ok){S.prestamos=S.prestamos.filter(x=>x!==l);S.gastos.forEach(g=>{if(g.prestamoId===l.id)g.prestamoId=''});save()}})}

const dL=$('#dlg-loan'),fL=$('#f-loan');
$('#add-loan').onclick=()=>{fL.reset();fL.inicio.value=todayISO();dL.showModal()};
dL.addEventListener('close',()=>{if(dL.returnValue!=='ok')return;
  const P=+fL.importe.value,n=+fL.n.value,i=(+fL.tin.value||0)/1200,start=fL.inicio.value,day=parse(start).getDate();
  const q=i?P*i/(1-Math.pow(1+i,-n)):P/n;const cuotas=[];let cap=P;
  for(let k=0;k<n;k++){const int=r2(cap*i);let am=r2(q-int);if(k===n-1)am=r2(cap);cuotas.push({id:uid(),fecha:addMonths(start,k,day),cuota:r2(am+int),amortizacion:am,intereses:int,capitalAntes:r2(cap),nota:''});cap=r2(cap-am)}
  const l={id:uid(),nombre:fL.nombre.value.trim(),entidad:fL.entidad.value.trim(),cuotas};S.prestamos.push(l);
  if(fL.addGasto.checked)S.gastos.push({id:uid(),concepto:l.nombre,importe:r2(q),categoria:t('cats').split('|')[1],dia:day,prestamoId:l.id});save()});

function importar(txt,origen){let d;try{d=JSON.parse(String(txt).trim());if(!Array.isArray(d.gastos)||!Array.isArray(d.prestamos))throw 0}
  catch(x){ask(t('err_t'),t('err_m',{src:origen}),t('entendido'),true);return}
  d.gastos.forEach(g=>{g.id=g.id||uid()});d.prestamos.forEach(l=>{l.id=l.id||uid();l.cuotas.forEach(c=>{c.id=c.id||uid()})});
  const n=d.gastos.length,m=d.prestamos.length;
  ask(t('ask_cargar'),t('ask_cargar_m',{n,m}),t('load')).then(ok=>{if(ok){S=d;save();$('#nav button[data-tab=resumen]').click()}})}
$('#imp').onchange=e=>{const f=e.target.files[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{importar(rd.result,t('orig_arch'));e.target.value=''};rd.readAsText(f)};

const setSync=k=>{syncKey=k;$('#sync').textContent=k?t(k):''};
const ICONS=['😀','😎','🦊','🐼','🦁','🐯','🐸','🦄','🚀','⭐','💎','🌿'];
const lsGet=k=>{try{return JSON.parse(store.get(k))}catch(e){return null}};
const refs=u=>({e:fb.Fs.doc(fb.db,'users',u,'data','estado'),p:fb.Fs.doc(fb.db,'users',u,'data','perfil')});
const validPhoto=s=>typeof s==='string'&&/^data:image\/(jpeg|png);base64,[A-Za-z0-9+\/=]+$/.test(s);

function setAuthView(v){$('#auth').classList.toggle('hidden',v==='none');
  $('#auth-load').classList.toggle('hidden',v!=='load');$('#auth-off').classList.toggle('hidden',v!=='off');$('#auth-box').classList.toggle('hidden',v!=='form')}
function authErr(c){const m={'auth/invalid-credential':'e_invalid','auth/wrong-password':'e_invalid','auth/user-not-found':'e_invalid','auth/invalid-login-credentials':'e_invalid','auth/email-already-in-use':'e_exists','auth/weak-password':'e_weak','auth/invalid-email':'e_email','auth/missing-email':'e_email','auth/network-request-failed':'e_net','auth/too-many-requests':'e_many','auth/requires-recent-login':'e_recent','auth/popup-closed-by-user':'','auth/cancelled-popup-request':''};
  const k=c in m?m[c]:'e_generic';return k?t(k):''}
function setAuthMode(m){authMode=m;const reg=m==='register';
  $('#seg-login').classList.toggle('on',!reg);$('#seg-reg').classList.toggle('on',reg);
  $('#a-name-wrap').classList.toggle('hidden',!reg);$('#a-hint').classList.toggle('hidden',!reg);$('#a-forgot').classList.toggle('hidden',reg);
  $('#a-pass').autocomplete=reg?'new-password':'current-password';
  $('#a-submit').textContent=t(reg?'a_submit_reg':'a_submit_login');$('#auth-err').textContent=''}
$('#seg-login').onclick=()=>setAuthMode('login');$('#seg-reg').onclick=()=>setAuthMode('register');
$('#a-retry').onclick=()=>location.reload();

async function loadFb(){
  const[A,Au,Fs]=await Promise.all([import(FB_BASE+'firebase-app.js'),import(FB_BASE+'firebase-auth.js'),import(FB_BASE+'firebase-firestore.js')]);
  const app=A.initializeApp(FB_CFG);fb={A,Au,Fs,auth:Au.getAuth(app),db:Fs.getFirestore(app)};
}
const REM_KEY='mis-gastos-remember',MAIL_KEY='mis-gastos-email';
async function applyPersistence(){const rem=$('#a-remember').checked;store.set(REM_KEY,rem?'1':'0');
  try{await fb.Au.setPersistence(fb.auth,rem?fb.Au.browserLocalPersistence:fb.Au.browserSessionPersistence)}catch(e){}
  if(rem){const m=$('#a-email').value.trim();if(m)store.set(MAIL_KEY,m)}else{try{localStorage.removeItem(MAIL_KEY)}catch(e){}}}
function offlineStart(){
  const uid=store.get('mis-gastos-last-uid'),loc=uid&&lsGet(keyOf(uid));
  if(!(loc&&Array.isArray(loc.gastos)&&Array.isArray(loc.prestamos))){setAuthView('off');return}
  curUid=uid;P=Object.assign({nombre:'',foto:'',icono:'',email:'',verified:false},lsGet('mis-gastos-perfil-'+uid)||{});
  S=loc;cloudMode=false;setAuthView('none');setSync('sync_fail');showTab('resumen');render();if(lockOn())showLock(true)}
async function initAuth(){
  $('#a-remember').checked=store.get(REM_KEY)!=='0';$('#a-email').value=store.get(MAIL_KEY)||'';
  setAuthView('load');
  try{await Promise.race([loadFb(),new Promise((_,r)=>setTimeout(()=>r(new Error('timeout')),10000))])}catch(e){offlineStart();return}
  fb.Au.onAuthStateChanged(fb.auth,u=>{u?onLogin(u):onLogout()});
}
$('#auth-form').addEventListener('submit',async e=>{e.preventDefault();
  const email=$('#a-email').value.trim(),pw=$('#a-pass').value,name=$('#a-name').value.trim(),err=$('#auth-err');err.textContent='';
  if(authMode==='register'&&!name){err.textContent=t('e_name');return}
  if(!fb)return;const btn=$('#a-submit');btn.disabled=true;
  try{
    await applyPersistence();
    if(authMode==='register'){pendingName=name;const c=await fb.Au.createUserWithEmailAndPassword(fb.auth,email,pw);
      try{await fb.Au.updateProfile(c.user,{displayName:name})}catch(x){}
      try{await fb.Au.sendEmailVerification(c.user)}catch(x){}}
    else await fb.Au.signInWithEmailAndPassword(fb.auth,email,pw);
  }catch(x){pendingName='';err.textContent=authErr(x.code||'')}
  btn.disabled=false});
$('#a-forgot').onclick=async()=>{const email=$('#a-email').value.trim(),err=$('#auth-err');err.textContent='';
  if(!email){err.textContent=t('a_need_email');return}
  try{await fb.Au.sendPasswordResetEmail(fb.auth,email);err.style.color='var(--ok)';err.textContent=t('a_reset_sent');setTimeout(()=>{err.style.color=''},6000)}catch(x){err.textContent=authErr(x.code||'')}};
$('#a-google').onclick=async()=>{const err=$('#auth-err');err.textContent='';if(!fb)return;
  const pr=new fb.Au.GoogleAuthProvider();
  await applyPersistence();
  try{await fb.Au.signInWithPopup(fb.auth,pr)}
  catch(x){const c=x.code||'';
    if(c==='auth/popup-blocked'||c==='auth/operation-not-supported-in-this-environment'){try{await fb.Au.signInWithRedirect(fb.auth,pr);return}catch(y){}}
    if(c!=='auth/popup-closed-by-user'&&c!=='auth/cancelled-popup-request')err.textContent=t('e_popup')}};

async function onLogin(u){
  if(curUid===u.uid)return;
  curUid=u.uid;store.set('mis-gastos-last-uid',u.uid);setAuthView('none');if(lockOn())showLock(true);
  P=Object.assign({nombre:'',foto:'',icono:''},lsGet('mis-gastos-perfil-'+u.uid)||{});
  P.email=u.email||'';P.verified=!!u.emailVerified;
  if(pendingName){P.nombre=pendingName;pendingName=''}else if(!P.nombre)P.nombre=u.displayName||'';
  const loc=lsGet(keyOf(u.uid));const hasLocal=!!(loc&&Array.isArray(loc.gastos)&&Array.isArray(loc.prestamos));
  S=hasLocal?loc:seed();cloudMode=true;if(!hasLocal)store.set(keyOf(u.uid),JSON.stringify(S));setSync('sync_conn');showTab('resumen');render();
  try{await syncStart(u,hasLocal)}catch(e){setSync('sync_fail')}
  offerBio(u.uid);
}
async function offerBio(uid){
  if(!bioOk||lockOn()||curUid!==uid||store.get('mis-gastos-biooffer-'+uid)||$('#dlg-ok').open)return;
  store.set('mis-gastos-biooffer-'+uid,'1');
  const ok=await ask(t('l_offer_t'),t('l_offer_m'),t('l_offer_yes'));
  if(ok&&curUid===uid){try{await lockEnable();renderProfile()}catch(e){}}
}
function onLogout(){
  showLock(false);curUid=null;try{localStorage.removeItem('mis-gastos-last-uid')}catch(e){}if(unsub){unsub();unsub=null}clearTimeout(pushTimer);
  S=seed();P={nombre:'',foto:'',icono:'',email:'',verified:false};cloudMode=false;setSync('');
  $('#a-pass').value='';setAuthMode('login');setAuthView('form');render();
}
async function syncStart(u,hasLocal){
  const F=fb.Fs,r=refs(u.uid);
  const[es,ps]=await Promise.all([F.getDoc(r.e),F.getDoc(r.p)]);
  if(curUid!==u.uid)return;
  if(ps.exists()){const d=ps.data();P.nombre=d.nombre??P.nombre;P.foto=d.foto||'';P.icono=d.icono||'';
    store.set('mis-gastos-perfil-'+u.uid,JSON.stringify({nombre:P.nombre,foto:P.foto,icono:P.icono}));renderProfile()}
  else saveProfile();
  const lts=store.get(tsKey(u.uid))||'';
  if(es.exists()){const d=es.data();
    if(!hasLocal||(d.actualizado||'')>lts){try{S=JSON.parse(d.json);store.set(keyOf(u.uid),d.json);store.set(tsKey(u.uid),d.actualizado||'');render()}catch(x){}}
    else if(lts>(d.actualizado||''))doPush();
  }else{
    const leg=lsGet(KEY);
    if(!hasLocal&&!store.get(KEY+'-migrado')&&leg&&Array.isArray(leg.gastos)&&Array.isArray(leg.prestamos)&&(leg.gastos.length||leg.prestamos.length)){
      const ok=await ask(t('m_found_t'),t('m_found_m'),t('load'));
      if(ok&&curUid===u.uid){S=leg;store.set(KEY+'-migrado','1');save()}
    }else if(hasLocal)doPush();
  }
  if(curUid!==u.uid)return;
  unsub=F.onSnapshot(r.e,snap=>{if(!snap.exists()||snap.metadata.hasPendingWrites)return;const d=snap.data();
    if(d.json&&d.json!==JSON.stringify(S)&&(d.actualizado||'')>(store.get(tsKey(curUid))||'')){try{S=JSON.parse(d.json);store.set(keyOf(curUid),d.json);store.set(tsKey(curUid),d.actualizado);render()}catch(x){}}
    setSync('sync_ok')},()=>setSync('sync_fail'));
  setSync('sync_ok');
}
function pushRemote(){if(!fb||!curUid)return;clearTimeout(pushTimer);pushTimer=setTimeout(doPush,800)}
async function doPush(){if(!fb||!curUid)return;if(pushing){pushAgain=true;return}pushing=true;
  try{await fb.Fs.setDoc(refs(curUid).e,{json:JSON.stringify(S),actualizado:store.get(tsKey(curUid))||new Date().toISOString()});setSync('sync_ok')}catch(e){setSync('sync_fail')}
  pushing=false;if(pushAgain){pushAgain=false;doPush()}}

/* ---------- Bloqueo con Face ID (WebAuthn, solo en este dispositivo) ---------- */
const LOCK_KEY='mis-gastos-lock-';
const b64=buf=>btoa(String.fromCharCode(...new Uint8Array(buf)));
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const lockOn=()=>!!(curUid&&store.get(LOCK_KEY+curUid));
let bioOk=false;
async function bioCheck(){try{bioOk=!!(window.PublicKeyCredential&&navigator.credentials&&await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable())}catch(e){bioOk=false}
  $('#sec-card').classList.toggle('hidden',!bioOk)}
const rnd=n=>crypto.getRandomValues(new Uint8Array(n));
async function lockEnable(){
  const cred=await navigator.credentials.create({publicKey:{challenge:rnd(32),rp:{name:'Personal Balance',id:location.hostname},
    user:{id:rnd(16),name:P.email||'user',displayName:P.nombre||P.email||'user'},pubKeyCredParams:[{type:'public-key',alg:-7},{type:'public-key',alg:-257}],
    authenticatorSelection:{authenticatorAttachment:'platform',userVerification:'required',residentKey:'preferred'},timeout:60000}});
  store.set(LOCK_KEY+curUid,b64(cred.rawId))}
async function lockVerify(){
  const id=store.get(LOCK_KEY+curUid);if(!id)return true;
  await navigator.credentials.get({publicKey:{challenge:rnd(32),allowCredentials:[{type:'public-key',id:unb64(id),transports:['internal']}],userVerification:'required',timeout:60000}});return true}
let unlocking=false;
async function tryUnlock(auto){if(unlocking)return;unlocking=true;
  try{await Promise.race([lockVerify(),new Promise((_,r)=>setTimeout(()=>r(Object.assign(new Error('timeout'),{name:'Timeout'})),20000))]);showLock(false)}catch(e){if(!auto||!(e&&(e.name==='NotAllowedError'||e.name==='SecurityError')))$('#l-err').textContent=t('l_fail')}
  unlocking=false}
function showLock(on){$('#lock').classList.toggle('hidden',!on);$('#l-err').textContent='';if(on)setTimeout(()=>tryUnlock(true),350)}
$('#l-unlock').onclick=()=>tryUnlock(false);
$('#l-out').onclick=()=>{showLock(false);if(fb)fb.Au.signOut(fb.auth)};
$('#p-lock').onchange=async e=>{
  try{if(e.target.checked){await lockEnable();profMsg('l_on')}else{try{localStorage.removeItem(LOCK_KEY+curUid)}catch(x){}profMsg('l_off')}}
  catch(x){e.target.checked=lockOn();$('#p-msg').textContent=t('l_fail')}};
let hiddenAt=0;
document.addEventListener('visibilitychange',()=>{if(document.hidden){hiddenAt=Date.now()}else if(lockOn()&&hiddenAt&&Date.now()-hiddenAt>30000)showLock(true)});

/* ---------- Perfil ---------- */
const avatarHTML=()=>validPhoto(P.foto)?`<img alt="" src="${P.foto}">`:P.icono?esc(P.icono):esc((P.nombre||P.email||'?').trim().charAt(0).toUpperCase());
function renderProfile(){
  $('#avatar').innerHTML=avatarHTML();$('#p-avatar').innerHTML=avatarHTML();
  $('#avatar').classList.toggle('hidden',!curUid);$('#p-lock').checked=lockOn();
  if(document.activeElement!==$('#p-name'))$('#p-name').value=P.nombre||'';
  $('#p-email').textContent=P.email||'';
  $('#p-verif').textContent=P.verified?t('p_verified'):t('p_unverified');$('#p-resend').classList.toggle('hidden',!!P.verified||!curUid);
  $('#p-photo-del').classList.toggle('hidden',!validPhoto(P.foto));
  $('#p-icons').innerHTML=ICONS.map(c=>`<button type="button" data-ic="${c}" class="${P.icono===c&&!validPhoto(P.foto)?'on':''}">${c}</button>`).join('');
}
function profMsg(k){const m=$('#p-msg');m.textContent=t(k);clearTimeout(profMsg.t);profMsg.t=setTimeout(()=>{m.textContent=''},3500)}
async function saveProfile(){if(!fb||!curUid)return;
  store.set('mis-gastos-perfil-'+curUid,JSON.stringify({nombre:P.nombre,foto:P.foto,icono:P.icono}));
  try{await fb.Fs.setDoc(refs(curUid).p,{nombre:P.nombre,foto:P.foto,icono:P.icono,actualizado:new Date().toISOString()});
    const cu=fb.auth.currentUser;if(cu&&cu.displayName!==P.nombre)await fb.Au.updateProfile(cu,{displayName:P.nombre})}catch(e){}}
async function refreshVerified(){try{const cu=fb&&fb.auth.currentUser;if(!cu)return;await cu.reload();P.verified=!!cu.emailVerified;renderProfile()}catch(e){}}
const CV=260;let crop=null;
function cropClamp(){const c=crop,w=c.nw*c.sc,h=c.nh*c.sc;c.x=Math.min(0,Math.max(CV-w,c.x));c.y=Math.min(0,Math.max(CV-h,c.y))}
function cropDraw(){cropClamp();const i=$('#crop-img');i.style.transform=`translate(${crop.x}px,${crop.y}px) scale(${crop.sc})`}
function cropZoom(z,cx=CV/2,cy=CV/2){const c=crop;z=Math.min(4,Math.max(1,z));const old=c.sc;c.sc=c.base*z;const k=c.sc/old;
  c.x=cx-(cx-c.x)*k;c.y=cy-(cy-c.y)*k;c.z=z;$('#crop-z').value=z;cropDraw()}
function openCrop(f){const url=URL.createObjectURL(f),img=$('#crop-img');
  img.onload=()=>{const nw=img.naturalWidth,nh=img.naturalHeight,base=Math.max(CV/nw,CV/nh);
    img.style.width=nw+'px';img.style.height=nh+'px';
    crop={url,nw,nh,base,sc:base,z:1,x:(CV-nw*base)/2,y:(CV-nh*base)/2};$('#crop-z').value=1;cropDraw();$('#dlg-crop').showModal()};
  img.onerror=()=>URL.revokeObjectURL(url);img.src=url}
{const vp=$('#crop-vp'),ptr=new Map();let last=null;
  vp.addEventListener('pointerdown',e=>{vp.setPointerCapture(e.pointerId);ptr.set(e.pointerId,{x:e.clientX,y:e.clientY});last=null});
  vp.addEventListener('pointermove',e=>{if(!crop||!ptr.has(e.pointerId))return;const o=ptr.get(e.pointerId);const n={x:e.clientX,y:e.clientY};
    if(ptr.size===1){crop.x+=n.x-o.x;crop.y+=n.y-o.y;ptr.set(e.pointerId,n);cropDraw()}
    else if(ptr.size===2){const other=[...ptr.entries()].find(([id])=>id!==e.pointerId)[1];
      const d0=Math.hypot(o.x-other.x,o.y-other.y),d1=Math.hypot(n.x-other.x,n.y-other.y);ptr.set(e.pointerId,n);if(d0>0)cropZoom(crop.z*d1/d0)}});
  const up=e=>{ptr.delete(e.pointerId)};vp.addEventListener('pointerup',up);vp.addEventListener('pointercancel',up);
  vp.addEventListener('wheel',e=>{if(!crop)return;e.preventDefault();cropZoom(crop.z*(e.deltaY<0?1.08:0.93))},{passive:false});
  $('#crop-z').addEventListener('input',e=>{if(crop)cropZoom(+e.target.value)})}
$('#dlg-crop').addEventListener('close',async()=>{const c=crop;crop=null;if(!c)return;
  if($('#dlg-crop').returnValue==='ok'){const img=$('#crop-img'),cv=document.createElement('canvas');cv.width=cv.height=256;
    cv.getContext('2d').drawImage(img,-c.x/c.sc,-c.y/c.sc,CV/c.sc,CV/c.sc,0,0,256,256);
    P.foto=cv.toDataURL('image/jpeg',.82);P.icono='';renderProfile();await saveProfile();profMsg('p_saved')}
  URL.revokeObjectURL(c.url);img_reset()});
function img_reset(){const i=$('#crop-img');i.removeAttribute('src')}
$('#p-file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(f)openCrop(f)};
$('#p-photo-del').onclick=()=>{P.foto='';renderProfile();saveProfile();profMsg('p_saved')};
$('#p-icons').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
  P.icono=P.icono===b.dataset.ic&&!validPhoto(P.foto)?'':b.dataset.ic;P.foto='';renderProfile();saveProfile();profMsg('p_saved')});
$('#p-name').onchange=e=>{P.nombre=e.target.value.trim();renderProfile();saveProfile();profMsg('p_saved')};
$('#p-resend').onclick=async()=>{try{await fb.Au.sendEmailVerification(fb.auth.currentUser);profMsg('p_verif_sent')}catch(x){$('#p-msg').textContent=authErr(x.code||'')}};
$('#p-pass').onclick=async()=>{try{await fb.Au.sendPasswordResetEmail(fb.auth,P.email);profMsg('a_reset_sent')}catch(x){$('#p-msg').textContent=authErr(x.code||'')}};
$('#p-out').onclick=()=>{if(fb)fb.Au.signOut(fb.auth)};
$('#p-del').onclick=()=>ask(t('p_delete_t'),t('p_delete_m'),t('p_delete'),false,true).then(async ok=>{if(!ok||!fb||!curUid)return;
  const uid=curUid,cu=fb.auth.currentUser;
  try{const r=refs(uid);if(unsub){unsub();unsub=null}
    await Promise.all([fb.Fs.deleteDoc(r.e),fb.Fs.deleteDoc(r.p)]);await fb.Au.deleteUser(cu);
    [keyOf(uid),tsKey(uid),'mis-gastos-perfil-'+uid].forEach(k=>{try{localStorage.removeItem(k)}catch(x){}})}
  catch(x){$('#p-msg').textContent=authErr(x.code||'')||t('e_generic')}});

window.__state=()=>S;
applyStatic();
render();
bioCheck();
initAuth();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
