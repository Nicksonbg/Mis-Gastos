<head>

<meta name="mobile-web-app-capable" content="yes">

<style>
:root{
  --bg:#f6f5f2;--card:#ffffff;--text:#1d1d1f;--muted:#6b6b70;--line:#e4e2dc;
  --accent:#2f6f5e;--accent-soft:#e3efe9;--warn:#b45309;--warn-soft:#fdf1e2;
  --bad:#b42318;--bad-soft:#fdecea;--ok:#1f7a4d;--ok-soft:#e5f4ec;
  --c1:#2f6f5e;--c2:#d97a3a;--c3:#4a6fa5;--c4:#b5487a;--c5:#8a7a2e;--c6:#6b5ba8;--c7:#3d9aa6;--c8:#9b4a3a;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141416;--card:#1e1e21;--text:#ececef;--muted:#9a9aa2;--line:#2e2e33;
  --accent:#6cc3a6;--accent-soft:#1d3029;--warn:#f0a35e;--warn-soft:#33261a;
  --bad:#f08a80;--bad-soft:#361d1b;--ok:#6cc39a;--ok-soft:#1b3026;
  --c1:#6cc3a6;--c2:#f0a35e;--c3:#82a6dc;--c4:#e283b0;--c5:#cdbb62;--c6:#a99ae0;--c7:#6cc9d4;--c8:#d98a78;color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#141416;--card:#1e1e21;--text:#ececef;--muted:#9a9aa2;--line:#2e2e33;
  --accent:#6cc3a6;--accent-soft:#1d3029;--warn:#f0a35e;--warn-soft:#33261a;
  --bad:#f08a80;--bad-soft:#361d1b;--ok:#6cc39a;--ok-soft:#1b3026;
  --c1:#6cc3a6;--c2:#f0a35e;--c3:#82a6dc;--c4:#e283b0;--c5:#cdbb62;--c6:#a99ae0;--c7:#6cc9d4;--c8:#d98a78;color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:14px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line);background:var(--card);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--card)}
header h1{font-size:19px;margin:0;margin-right:auto}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;padding:8px 14px;border-radius:8px;color:var(--muted);font:inherit;cursor:pointer}
nav button svg{display:none}
nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
main{max-width:1100px;margin:0 auto;padding-block:20px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.sync{font-size:12px;color:var(--muted)}
.grid{display:grid;gap:16px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.two{grid-template-columns:repeat(auto-fit,minmax(340px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px}
.card h2{font-size:15px;margin:0 0 12px;font-weight:600}
.kpi .lbl{color:var(--muted);font-size:13px}
.kpi .val{font-size:26px;font-weight:650;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .sub{color:var(--muted);font-size:13px;margin-top:2px}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.03em}
td.n,th.n{text-align:right}
tr.paid td{color:var(--muted)}
tr.next td{background:var(--accent-soft)}
tfoot td{font-weight:650;border-bottom:0}
.btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:8px 14px;font:inherit;cursor:pointer}
:root[data-theme="dark"] .btn:not(.ghost):not(.danger){color:#10201b}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .btn:not(.ghost):not(.danger){color:#10201b}}
.btn.ghost{background:none;color:var(--text);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.btn.sm{padding:4px 9px;font-size:13px}
.icon{background:none;border:0;cursor:pointer;color:var(--muted);padding:4px 6px;border-radius:6px;font-size:14px}
.icon:hover{background:var(--bg);color:var(--text)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:600}
.pill.ok{background:var(--ok-soft);color:var(--ok)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.mute{background:var(--bg);color:var(--muted)}
.bar{height:10px;background:var(--bg);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.bar>i{display:block;height:100%;background:var(--accent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.alert{border-radius:10px;padding:12px 14px;margin-bottom:16px;display:flex;gap:10px;align-items:flex-start}
.alert.warn{background:var(--warn-soft);color:var(--warn)}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.alert.info{background:var(--accent-soft);color:var(--accent)}
.legend{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.legend li{display:flex;align-items:center;gap:8px;font-size:14px}
.legend .sw{width:12px;height:12px;border-radius:3px;flex:none}
.legend .amt{margin-left:auto;font-variant-numeric:tabular-nums}
.donut-wrap{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.donut-wrap svg{flex:none}
.donut-wrap .legend{flex:1;min-width:200px}
.upc{list-style:none;padding:0;margin:0}
.upc li{display:flex;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.upc li:last-child{border-bottom:0}
.upc .d{width:52px;text-align:center;flex:none;border-radius:8px;background:var(--bg);padding:4px 0;line-height:1.1}
.upc .d b{display:block;font-size:18px}
.upc .d span{font-size:11px;color:var(--muted);text-transform:uppercase}
.upc .amt{margin-left:auto;font-weight:600;font-variant-numeric:tabular-nums}
.loan-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:14px 0}
.loan-stats div .lbl{font-size:12px;color:var(--muted)}
.loan-stats div .v{font-weight:600;font-variant-numeric:tabular-nums}
details summary{cursor:pointer;color:var(--accent);font-weight:600;margin-top:6px}

/* Globos guía (onboarding) */
#tour-dim{position:fixed;inset:0;z-index:9998}
#tour-hole{position:fixed;z-index:9998;border-radius:14px;box-shadow:0 0 0 9999px rgba(0,0,0,.72);transition:all .28s cubic-bezier(.4,0,.2,1);pointer-events:none}
#tour-hole.pulse{animation:tourpulse 1.6s ease-in-out infinite}
@keyframes tourpulse{0%,100%{box-shadow:0 0 0 9999px rgba(0,0,0,.72),0 0 0 0 rgba(255,255,255,.35)}50%{box-shadow:0 0 0 9999px rgba(0,0,0,.72),0 0 0 7px rgba(255,255,255,0)}}
#tour-pop{position:fixed;z-index:9999;max-width:320px;width:calc(100vw - 32px);background:var(--card,#1c1c1e);color:var(--text,#fff);border:1px solid var(--line,#333);border-radius:16px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.5);transition:top .28s,left .28s}
#tour-pop h4{margin:0 0 6px;font-size:17px}
#tour-pop p{margin:0;color:var(--muted,#aaa);font-size:14px;line-height:1.45}
#tour-pop .tour-bar{display:flex;align-items:center;gap:10px;margin-top:14px}
#tour-pop .tour-dots{display:flex;gap:5px}
#tour-pop .tour-dots i{width:6px;height:6px;border-radius:50%;background:var(--line,#444)}
#tour-pop .tour-dots i.on{background:var(--accent,#30d158)}
#tour-pop .tour-arrow{position:absolute;width:14px;height:14px;background:var(--card,#1c1c1e);border:1px solid var(--line,#333);transform:rotate(45deg)}
#tour-pop.below .tour-arrow{top:-8px;border-right:none;border-bottom:none}
#tour-pop.above .tour-arrow{bottom:-8px;border-left:none;border-top:none}
#tour-skip{background:none;border:none;color:var(--muted,#999);font:inherit;cursor:pointer;padding:6px}

.tbl-wrap{overflow-x:auto}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--text);padding:20px;width:min(460px,92vw)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog h3{margin:0 0 14px}
label.f{display:block;margin-bottom:10px;font-size:13px;color:var(--muted)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font:inherit}
input,select,textarea{font-size:16px!important}
#f-watch input,#f-watch select,#finnhub-key{padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text);font-family:inherit}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.hidden{display:none!important}
.chart svg text{fill:var(--muted);font-size:11px}
#debtchart{position:relative}
.chart svg .hit{cursor:default}
.tip{position:absolute;z-index:3;pointer-events:none;background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 10px;box-shadow:0 4px 14px rgba(0,0,0,.15);font-size:13px;min-width:190px;font-variant-numeric:tabular-nums}
.tip .tip-tot{font-size:15px;font-weight:650;margin:2px 0 4px}
.tip .tip-row{display:flex;align-items:center;gap:6px;color:var(--muted)}
.tip .tip-row span:last-child{margin-left:auto;color:var(--text)}
.tip .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
.avatar{width:36px;height:36px;border-radius:50%;border:0;padding:0;overflow:hidden;background:var(--accent-soft);color:var(--accent);font:700 17px/1 inherit;display:grid;place-items:center;cursor:pointer;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}
.avatar.big{width:96px;height:96px;font-size:44px;cursor:default}
#auth{position:fixed;inset:0;z-index:50;background:var(--bg);overflow:auto;display:grid;place-items:center;padding:20px}
.auth-card{width:min(400px,100%)}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);padding:4px;border-radius:10px;margin-bottom:14px}
.ai{display:inline-flex;position:relative;width:26px;height:26px;flex:0 0 26px;border-radius:50%;background:var(--bg);align-items:center;justify-content:center;font-size:12px;font-weight:700;vertical-align:middle;margin-right:8px;overflow:hidden;color:var(--muted)}
.ai img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#fff}
.utabs{display:flex;gap:24px;overflow-x:auto;border-bottom:1px solid var(--line);margin:0 0 14px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.utabs::-webkit-scrollbar{display:none}
.utabs button{flex:0 0 auto;background:none;border:0;border-bottom:3px solid transparent;margin-bottom:-1px;padding:10px 0;font:inherit;font-size:16px;color:var(--muted);cursor:pointer;white-space:nowrap}
.utabs button.on{color:var(--text);font-weight:700;border-bottom-color:var(--accent)}
.seg3{grid-template-columns:repeat(3,1fr)}
.seg button{border:0;background:none;padding:8px;border-radius:8px;font:inherit;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.18)}
.err{color:var(--bad);font-size:13px;min-height:18px;margin:2px 0 8px}
.okm{color:var(--ok);font-size:13px;min-height:18px}
.icons{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0 14px}
.icons button{font-size:24px;padding:8px 0;border:1px solid var(--line);background:var(--bg);border-radius:10px;cursor:pointer}
.icons button.on{border-color:var(--accent);background:var(--accent-soft)}
.btn.wide{width:100%}
.linkbtn{background:none;border:0;color:var(--accent);font:inherit;cursor:pointer;padding:4px 0}
#crop-vp{position:relative;width:260px;height:260px;margin:0 auto 14px;overflow:hidden;background:#000;touch-action:none;cursor:grab;border-radius:8px}
#crop-vp img{position:absolute;left:0;top:0;max-width:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none;pointer-events:none}
#crop-vp .ring{position:absolute;inset:0;border-radius:50%;box-shadow:0 0 0 400px rgba(0,0,0,.6);border:2px solid #fff;pointer-events:none}
#crop-z{width:100%}
.pw{position:relative;margin-top:4px}.pw input{margin-top:0!important;padding-right:44px!important}.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;color:var(--muted);padding:6px;border-radius:6px;cursor:pointer;display:grid;place-items:center}.pw-eye:hover{color:var(--text)}.pw-eye .eye-off{display:none}.pw-eye.on .eye-on{display:none}.pw-eye.on .eye-off{display:block}
#lock{position:fixed;inset:0;z-index:60;background:var(--bg);display:grid;place-items:center;padding:20px;text-align:center}
@media (max-width:600px){
  header{flex-wrap:nowrap;gap:10px}header h1{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:17px}.sync{font-size:11px}
  .kpi .val{font-size:20px}th,td{padding:7px 4px}.hide-sm{display:none}
  .kpis{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:14px}
  nav{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:6;background:linear-gradient(180deg,color-mix(in srgb,var(--card) 34%,transparent),color-mix(in srgb,var(--card) 18%,transparent));-webkit-backdrop-filter:blur(26px) saturate(2);backdrop-filter:blur(26px) saturate(2);border:1px solid rgba(255,255,255,.45);border-radius:30px;box-shadow:0 10px 30px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.35),inset 0 -1px 0 rgba(255,255,255,.08);display:grid;grid-template-columns:repeat(var(--ncols,5),1fr);gap:2px;padding:6px}
  nav button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:8px 2px;font-size:11px;line-height:1.1;border-radius:22px}
  nav button svg{display:block}
  nav button.on{background:color-mix(in srgb,var(--accent) 20%,transparent);box-shadow:inset 0 1px 0 rgba(255,255,255,.3)}
  nav button span{display:block;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  main{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
}
/* ================= Estilo oscuro tipo "panel de inversión" ================= */
:root:not([data-theme="light"]){
  --bg:#000;--card:#161616;--card2:#1f1f1f;--chip:#262626;--text:#fff;--muted:#8e8e93;--line:#262626;
  --accent:#5ad37a;--accent-soft:rgba(90,211,122,.14);--warn:#f5a524;--warn-soft:rgba(245,165,36,.13);
  --bad:#ff5a4e;--bad-soft:rgba(255,90,78,.14);--ok:#5ad37a;--ok-soft:rgba(90,211,122,.14);
  --c1:#5ad37a;--c2:#4c8dff;--c3:#f5a524;--c4:#c084fc;--c5:#ff5a4e;--c6:#2dd4bf;--c7:#f472b6;--c8:#a3a3a3;color-scheme:dark;
}
:root[data-theme="light"]{--card2:#f1f0ec;--chip:#ecebe6}
body{font-family:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:-.005em}
.mono,.hero-val,.kpi .val,.upc .amt,td.n,.loan-stats .v{font-variant-numeric:tabular-nums}
header{background:var(--bg);border-bottom:0;padding-block:12px}
body::before{background:var(--bg)}
header h1{font-size:22px;font-weight:800;letter-spacing:-.02em}
header .sync{display:none}
header .avatar{width:40px;height:40px;box-shadow:0 0 0 2px var(--chip)}
nav button{border-radius:999px;padding:8px 15px;font-weight:600;font-size:14px;color:var(--muted)}
nav button:hover{color:var(--text)}
nav button.on{background:var(--chip);color:var(--text)}
main{max-width:1080px}
.card{border:0;border-radius:18px;padding:20px}
.card h2{font-size:17px;font-weight:700;margin-bottom:14px}
.btn{background:var(--text);color:var(--bg)!important;border-radius:999px;padding:10px 18px;font-weight:700}
.btn.ghost{background:var(--card);color:var(--text)!important;border:1px solid var(--chip)}
.btn.danger{background:transparent;color:var(--bad)!important;border:1px solid var(--chip)}
.btn.sm{padding:6px 12px;font-size:13px}
.icon:hover{background:var(--chip)}
th{text-transform:none;letter-spacing:0;font-weight:500;font-size:13px}
th,td{border-bottom:1px solid var(--line);padding:11px 8px}
tr.next td{background:var(--accent-soft)}
.pill{border-radius:999px;padding:3px 10px}
.pill.mute{background:var(--chip)}
.bar{height:8px;background:var(--chip);border:0}
.bar>i{border-radius:999px}
.alert{border-radius:16px;padding:14px 16px}
.upc .d{background:var(--chip);border-radius:12px}
label.f input,label.f select,label.f textarea,#f-watch input,#f-watch select,select,input[name=confirm]{background:var(--card2)!important;border:1px solid var(--chip)!important;border-radius:12px!important;color:var(--text)}
dialog{background:var(--card);border:1px solid var(--chip);border-radius:22px;padding:22px}
dialog::backdrop{background:rgba(0,0,0,.6);backdrop-filter:blur(4px)}
details summary{color:var(--text);font-weight:600}
.flash{border-radius:14px}
.legend li{font-size:14px}
.donut-wrap svg path{stroke:var(--card)}
/* Tarjeta principal */
.hero{padding:22px 22px 18px}
.hero-top{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px}
.hero-top .dot{width:7px;height:7px;border-radius:50%;background:var(--accent)}
.hero-val{font-family:"DM Mono",ui-monospace,monospace;font-size:44px;font-weight:500;line-height:1.1;margin:8px 0 4px;letter-spacing:-.03em}
.hero-val .cur{font-size:22px;margin-right:6px;vertical-align:.45em}
.hero-val .dec{font-size:22px}
.hero-sub{font-family:"DM Mono",ui-monospace,monospace;font-size:15px}
.up{color:var(--ok)}.down{color:var(--bad)}
.hero-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-top:18px}
.hero-stats>div{background:var(--card2);border-radius:14px;padding:12px 14px}
.hero-stats .lbl{font-size:12px;color:var(--muted)}
.hero-stats .v{font-size:18px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.hero-stats .s{font-size:12px;color:var(--muted);margin-top:2px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips a{padding:6px 12px;border-radius:999px;color:var(--muted);text-decoration:none;font-weight:600;font-size:13px}
.chips a.on{background:var(--chip);color:var(--text)}
.banner{border-radius:18px;padding:22px;margin-bottom:16px;background:linear-gradient(135deg,#0d1730 0%,#14244d 100%);color:#fff}
.banner h1{font-size:22px;line-height:1.25;margin:0 0 8px;font-weight:800}
.banner p{margin:0;color:#b9c2d8;font-size:14px}
@media (max-width:600px){
  .hero-val{font-size:38px}
  nav{background:rgba(22,22,22,.72)!important;border:1px solid rgba(255,255,255,.08)!important;box-shadow:0 10px 30px rgba(0,0,0,.5)!important}
  :root[data-theme="light"] nav{background:rgba(255,255,255,.7)!important;border-color:rgba(0,0,0,.08)!important}
  nav button.on{background:var(--chip)}
}
@media (max-width:600px){
  nav button{padding:8px 2px;font-size:11px;border-radius:22px}
  .hero-stats{grid-template-columns:1fr 1fr}
  .hero-stats>div:last-child{grid-column:1/-1}
  .hero-stats .v{font-size:16px}

const LANGS={es:{loc:'es-ES',dec:',',sep:'/'},en:{loc:'en-GB',dec:'.',sep:'/'},bg:{loc:'bg-BG',dec:',',sep:'.'}};
const IDX={es:0,en:1,bg:2};
let lang='es';try{const v=localStorage.getItem('mis-gastos-lang');if(LANGS[v])lang=v}catch(e){}
const t=(k,p)=>{const r=TR[k];let s=r?r[IDX[lang]]:k;return p?s.replace(/\{(\w+)\}/g,(m,x)=>x in p?p[x]:m):s};
let eur,MES;
const mkFmt=()=>{eur=new Intl.NumberFormat(LANGS[lang].loc,{style:'currency',currency:'EUR',useGrouping:'always'});MES=t('meses_c').split('|')};
mkFmt();
const dec=s=>String(s).replace('.',LANGS[lang].dec);
const money=v=>eur.format(+v||0);
const heroHTML=v=>{const p=new Intl.NumberFormat(LANGS[lang].loc,{minimumFractionDigits:2,maximumFractionDigits:2,useGrouping:'always'}).format(r2(v)),d=LANGS[lang].dec,i=p.lastIndexOf(d);return`<span class="cur">€</span>${i<0?p:p.slice(0,i)}<span class="dec">${i<0?'':p.slice(i)}</span>`};
const r2=v=>Math.round((+v||0)*100)/100;
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fmtD=s=>{if(!s)return'';const[y,m,d]=s.split('-');const p=LANGS[lang].sep;return d+p+m+p+y};
const parse=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const todayISO=()=>iso(new Date());
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}}};

function addMonths(isoStr,k,day){const d=parse(isoStr);const t=new Date(d.getFullYear(),d.getMonth()+k,1);const last=new Date(t.getFullYear(),t.getMonth()+1,0).getDate();t.setDate(Math.min(day??d.getDate(),last));return iso(t)}

/* ---------- Datos iniciales ---------- */
function seed(){return{version:1,gastos:[],prestamos:[],inversiones:[],watch:[],movimientos:[],presupuestos:[]}}

let S=seed(),curUid=null,P={nombre:'',foto:'',icono:'',email:'',verified:false},mesOff=0;
const keyOf=u=>KEY+'-'+u,tsKey=u=>KEY+'-ts-'+u;
const save=()=>{if(curUid){store.set(keyOf(curUid),JSON.stringify(S));store.set(tsKey(curUid),new Date().toISOString())}render();pushRemote()};

/* ---------- Cálculos ---------- */
const isPaid=c=>c.pagada===true||(c.pagada!==false&&c.fecha<=todayISO());
const sorted=l=>[...l.cuotas].sort((a,b)=>a.fecha<b.fecha?-1:a.fecha>b.fecha?1:0);
function loanStats(l){
  const cs=sorted(l);const paid=cs.filter(isPaid),pend=cs.filter(c=>!isPaid(c));
  const sum=(a,k)=>r2(a.reduce((s,c)=>s+(+c[k]||0),0));
  const next=pend[0]||null;
  const overdue=pend.filter(c=>c.fecha<todayISO());
  return{cs,n:cs.length,nPaid:paid.length,nPend:pend.length,total:sum(cs,'cuota'),intereses:sum(cs,'intereses'),
    pagado:sum(paid,'cuota'),pendiente:sum(pend,'cuota'),capital:sum(pend,'amortizacion'),intPend:sum(pend,'intereses'),
    next,overdue,fin:cs.length?cs[cs.length-1].fecha:null,inicio:cs.length?cs[0].fecha:null};
}
/* Meses de cobro (1-12) de un gasto fijo; [] = todos los meses */
const mesesDe=g=>{const m=[...new Set((g.meses||[]).map(Number).filter(x=>x>=1&&x<=12))].sort((a,b)=>a-b);return m.length===12?[]:m};
const cobraEn=(g,month)=>{const m=mesesDe(g);return!m.length||m.includes(month)};
const mensual=g=>{const m=g.prestamoId?[]:mesesDe(g);return m.length?(+g.importe||0)*m.length/12:(+g.importe||0)};
const totalMes=()=>r2(S.gastos.reduce((s,g)=>s+mensual(g),0));
const loanById=id=>S.prestamos.find(l=>l.id===id);

/* ---------- Render ---------- */
const $=s=>document.querySelector(s);
function render(){S.movimientos=S.movimientos||[];try{renderSum()}catch(e){}invVis();S.presupuestos=S.presupuestos||[];setTimeout(()=>{try{ppCheck()}catch(e){}},800);renderInv();renderDia();renderPres();renderResumen();renderGastos();renderLoans();renderAlerts();renderDatos();renderProfile()}

function renderAlerts(){
  const out=[];
  S.prestamos.forEach(l=>{const st=loanStats(l);
    if(st.overdue.length)out.push(`<div class="alert bad">⚠️ <div>${t('al_overdue',{name:esc(l.nombre),n:st.overdue.length,date:fmtD(st.overdue[0].fecha)})}</div></div>`);
  });
  const soon=upcoming(7);
  if(soon.length)out.push(`<div class="alert warn">🔔 <div>${t('al_soon')} ${soon.map(u=>t('al_soon_item',{name:esc(u.nombre),amt:money(u.importe),date:fmtD(u.fecha)})).join(' · ')}</div></div>`);

  if(!S.gastos.length&&!S.prestamos.length)out.unshift('<div class="alert info"><div>'+t('welcome')+'</div></div>');
  $('#alerts').innerHTML=out.join('');
}

function upcoming(days){
  const t=todayISO();const lim=iso(new Date(Date.now()+days*864e5));const items=[];
  const linked=new Set(S.prestamos.map(l=>l.id));
  S.prestamos.forEach(l=>sorted(l).forEach(c=>{if(!isPaid(c)&&c.fecha<=lim)items.push({fecha:c.fecha,nombre:l.nombre,importe:c.cuota,tipo:c.fecha<t?'vencido':'préstamo',nota:c.nota})}));
  S.gastos.forEach(g=>{if(!g.dia||(g.prestamoId&&linked.has(g.prestamoId)))return;
    const now=new Date();for(let k=0;k<(mesesDe(g).length?13:3);k++){const f=addMonths(iso(new Date(now.getFullYear(),now.getMonth(),1)),k,+g.dia);if(f>=t&&f<=lim&&cobraEn(g,+f.slice(5,7)))items.push({fecha:f,nombre:g.concepto,importe:g.importe,tipo:'gasto'})}});
  return items.sort((a,b)=>a.fecha<b.fecha?-1:1);
}

const mesKey=d=>d.getFullYear()+'-'+pad(d.getMonth()+1);
function mesItems(off=mesOff){
  const now=new Date();const m0=new Date(now.getFullYear(),now.getMonth()+off,1);const mk=mesKey(m0);const t=todayISO();
  const items=[];
  S.gastos.forEach(g=>{
    const l=g.prestamoId&&loanById(g.prestamoId);
    if(l){const cs=l.cuotas.filter(c=>c.fecha.slice(0,7)===mk).sort((a,b)=>a.fecha<b.fecha?-1:1);
      if(!cs.length)return; // préstamo sin cuota este mes
      cs.forEach(c=>items.push({tipo:'cuota',ref:l.id+'|'+c.id,concepto:g.concepto+(c.nota?' ('+c.nota+')':''),fecha:c.fecha,importe:+c.cuota,pagado:isPaid(c),manual:c.pagada!=null}));return}
    if(!cobraEn(g,m0.getMonth()+1))return; // no se cobra este mes
    let fecha=null;if(g.dia){const last=new Date(m0.getFullYear(),m0.getMonth()+1,0).getDate();fecha=mk+'-'+pad(Math.min(+g.dia,last))}
    const ov=g.pagos&&g.pagos[mk];const auto=!!fecha&&fecha<=t;
    items.push({tipo:'gasto',ref:g.id+'|'+mk,concepto:g.concepto,fecha,importe:+g.importe,pagado:ov!=null?ov:auto,manual:ov!=null,auto});
  });
  return{m0,items:items.sort((a,b)=>(a.fecha||'9')<(b.fecha||'9')?-1:1)};
}

function renderDebtChart(){
  const loans=S.prestamos.filter(l=>l.cuotas.length);if(!loans.length){$('#debtchart').innerHTML=`<p class="muted">${t('sin_prestamos')}</p>`;return}
  let min=null,max=null;loans.forEach(l=>{const s=loanStats(l);if(!min||s.inicio<min)min=s.inicio;if(!max||s.fin>max)max=s.fin});
  const months=[];let d=parse(min);d=new Date(d.getFullYear(),d.getMonth(),1);const end=parse(max);
  while(d<=end){months.push(new Date(d));d=new Date(d.getFullYear(),d.getMonth()+1,1)}
  // pendiente al final de cada mes = suma de cuotas con fecha posterior al fin de mes
  const data=months.map(m=>{const eom=iso(new Date(m.getFullYear(),m.getMonth()+1,0));return loans.map(l=>r2(l.cuotas.filter(c=>c.fecha>eom).reduce((s,c)=>s+ +c.cuota,0)))});
  const top=Math.max(...data.map(v=>v.reduce((a,b)=>a+b,0)),1);
  const W=900,H=240,pl=56,pb=26,pt=10,bw=(W-pl-10)/months.length;
  const step=top>8000?2000:top>4000?1000:500;const yTop=Math.ceil(top/step)*step;
  const y=v=>pt+(H-pt-pb)*(1-v/yTop);let s='';
  for(let v=0;v<=yTop;v+=step){s+=`<line x1="${pl}" x2="${W-10}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(v)+4}" text-anchor="end">${(v/1000).toLocaleString(LANGS[lang].loc)} k€</text>`}
  const now=new Date();
  months.forEach((m,i)=>{let acc=0;const x=pl+i*bw+1.5;
    loans.forEach((l,j)=>{const v=data[i][j];if(v<=0)return;s+=`<rect x="${x}" width="${Math.max(bw-3,1)}" y="${y(acc+v)}" height="${y(acc)-y(acc+v)}" fill="var(--c${j%8+1})"${m.getFullYear()===now.getFullYear()&&m.getMonth()===now.getMonth()?'':' opacity=".75"'}/>`;acc+=v});
    if(m.getMonth()===0||i===0)s+=`<text x="${x}" y="${H-8}">${MES[m.getMonth()]} ${String(m.getFullYear()).slice(2)}</text>`;
    if(m.getFullYear()===now.getFullYear()&&m.getMonth()===now.getMonth())s+=`<text x="${x+bw/2}" y="${pt+8}" text-anchor="middle" style="fill:var(--text);font-weight:600">hoy</text><line x1="${x+bw/2}" x2="${x+bw/2}" y1="${pt+12}" y2="${H-pb}" stroke="var(--text)" stroke-dasharray="3 3" opacity=".5"/>`;
  });
  // zonas invisibles por mes para el tooltip
  months.forEach((m,i)=>{s+=`<rect class="hit" data-i="${i}" x="${pl+i*bw}" y="${pt}" width="${bw}" height="${H-pt-pb}" fill="transparent"/>`});
  s+=`<rect id="debt-hl" fill="none" stroke="var(--text)" stroke-width="1.5" rx="1" visibility="hidden" pointer-events="none"/>`;
  const box=$('#debtchart');
  box.innerHTML=`<div class="tip hidden" id="debt-tip"></div><svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${t('aria_deuda')}">${s}</svg><ul class="legend row" style="display:flex;gap:16px">${loans.map((l,j)=>`<li><span class="sw" style="background:var(--c${j%8+1})"></span>${esc(l.nombre)}</li>`).join('')}</ul><p class="muted small">${t('deuda_nota')}</p>`;
  const tip=$('#debt-tip'),svgEl=box.querySelector('svg');let hl=null;
  const show=(e)=>{const r=e.target.closest('.hit');if(!r){hide();return}const i=+r.dataset.i,m=months[i];
    const tot=r2(data[i].reduce((a,b)=>a+b,0));
    tip.innerHTML=`<b>${MES[m.getMonth()]} ${m.getFullYear()}</b><div class="tip-tot">${t('restante')}: ${money(tot)}</div>`+loans.map((l,j)=>`<div class="tip-row"><span class="sw" style="background:var(--c${j%8+1})"></span>${esc(l.nombre)}<span>${money(data[i][j])}</span></div>`).join('');
    tip.classList.remove('hidden');
    const hlEl=box.querySelector('#debt-hl');if(tot>0){hlEl.setAttribute('x',pl+i*bw+1.5);hlEl.setAttribute('width',Math.max(bw-3,1));hlEl.setAttribute('y',y(tot));hlEl.setAttribute('height',y(0)-y(tot));hlEl.setAttribute('visibility','visible')}else hlEl.setAttribute('visibility','hidden');hl=hlEl;
    const br=box.getBoundingClientRect(),rr=r.getBoundingClientRect();
    let left=rr.right-br.left+10;if(left+tip.offsetWidth>br.width)left=rr.left-br.left-tip.offsetWidth-10;
    const top=(e.clientY||rr.top+rr.height/2)-br.top-tip.offsetHeight/2;
    tip.style.left=Math.max(0,left)+'px';tip.style.top=Math.max(0,Math.min(top,rr.bottom-br.top-tip.offsetHeight))+'px'};
  const hide=()=>{tip.classList.add('hidden');if(hl){hl.setAttribute('visibility','hidden');hl=null}};
  svgEl.addEventListener('mousemove',show);svgEl.addEventListener('click',show);svgEl.addEventListener('mouseleave',hide);
}

let diaOff=0;

function gastoCat(mk){const o={};
  S.gastos.forEach(g=>{const c=(g.categoria||'').trim().toLowerCase();if(!c)return;const l=g.prestamoId&&loanById(g.prestamoId);
    const v=l?l.cuotas.filter(x=>(x.fecha||'').slice(0,7)===mk).reduce((a,x)=>a+(+x.cuota||0),0):(cobraEn(g,+mk.slice(5,7))?(+g.importe||0):0);o[c]=(o[c]||0)+v});

function tourShow(){
  const st=TOUR[tourI],hole=$('#tour-hole'),pop=$('#tour-pop');
  if(!pop)return;
  if(st.go){try{st.go()}catch(e){}}
  setTimeout(()=>{
    let el=st.sel?document.querySelector(st.sel):null;
    const visible=el&&el.getClientRects().length>0&&el.getBoundingClientRect().width>0;
    if(st.sel&&!visible){if(tourI<TOUR.length-1){tourI++;return tourShow()}el=null}
    const dots='<div class="tour-dots">'+TOUR.map((_,i)=>`<i class="${i===tourI?'on':''}"></i>`).join('')+'</div>';
    const last=tourI===TOUR.length-1;
    pop.innerHTML=`<div class="tour-arrow"></div><h4>${esc(t('tour_'+st.k+'_t'))}</h4><p>${esc(t('tour_'+st.k+'_b'))}</p>`+
      `<div class="tour-bar">${dots}<span class="spacer" style="flex:1"></span>`+
      (last?'':`<button id="tour-skip">${esc(t('tour_skip'))}</button>`)+
      `<button class="btn sm" id="tour-go">${esc(last?t('tour_done'):t('tour_next'))}</button></div>`;
    $('#tour-go').onclick=tourNext;const sk=$('#tour-skip');if(sk)sk.onclick=tourEnd;
    const arrow=pop.querySelector('.tour-arrow');
    if(el&&st.sel){
      el.scrollIntoView({block:'center',behavior:'smooth'});
      setTimeout(()=>{
        const r=el.getBoundingClientRect(),pad=8;
        hole.style.display='block';hole.classList.add('pulse');
        hole.style.top=(r.top-pad)+'px';hole.style.left=(r.left-pad)+'px';
        hole.style.width=(r.width+pad*2)+'px';hole.style.height=(r.height+pad*2)+'px';
        pop.style.transform='';arrow.style.display='';
        const pr=pop.getBoundingClientRect(),below=(st.pos||'below')==='below';
        const top=below?r.bottom+14:r.top-pr.height-14;
        pop.classList.toggle('below',below);pop.classList.toggle('above',!below);
        pop.style.top=Math.max(12,Math.min(top,innerHeight-pr.height-12))+'px';
        const left=Math.min(Math.max(12,r.left+r.width/2-pr.width/2),innerWidth-pr.width-12);
        pop.style.left=left+'px';
        arrow.style.left=Math.max(14,Math.min(r.left+r.width/2-left-7,pr.width-28))+'px';
      },280);
    }else{
      hole.style.display='none';hole.classList.remove('pulse');
      pop.classList.remove('below','above');arrow.style.display='none';
      pop.style.top='50%';pop.style.left='50%';pop.style.transform='translate(-50%,-50%)';
    }
  },st.go?240:0);
}

$('#p-pass').onclick=async()=>{try{await fb.Au.sendPasswordResetEmail(fb.auth,P.email);profMsg('a_reset_sent')}catch(x){$('#p-msg').textContent=authErr(x.code||'')}};
$('#p-out').onclick=()=>{if(fb)fb.Au.signOut(fb.auth)};
$('#p-del').onclick=()=>ask(t('p_delete_t'),t('p_delete_m'),t('p_delete'),false,true).then(async ok=>{if(!ok||!fb||!curUid)return;
  const uid=curUid,cu=fb.auth.currentUser;

    await Promise.all([fb.Fs.deleteDoc(r.e),fb.Fs.deleteDoc(r.p)]);await fb.Au.deleteUser(cu);
    [keyOf(uid),tsKey(uid),'mis-gastos-perfil-'+uid].forEach(k=>{try{localStorage.removeItem(k)}catch(x){}})}
  catch(x){$('#p-msg').textContent=authErr(x.code||'')||t('e_generic')}});

window.__state=()=>S;
applyStatic();
render();
bioCheck();
initAuth();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();

<script>
/* ---------- Instalar la app (Android: un toque · iPhone: guía hasta Compartir) ---------- */
(()=>{
const T={
 t:["Instala Personal Balance","Install Personal Balance","Инсталирай Personal Balance"],
 and:["Tenla en tu pantalla de inicio como una app más, sin tiendas.","Keep it on your home screen like any other app, no store needed.","Дръж я на началния екран като всяко приложение, без магазин."],
 btn:["Instalar","Install","Инсталирай"],
 later:["Ahora no","Not now","Не сега"],
 andm:["Pulsa el menú <span class='k'>⋮</span> del navegador y elige <b>Instalar app</b> o <b>Añadir a pantalla de inicio</b>.","Tap the browser menu <span class='k'>⋮</span> and choose <b>Install app</b> or <b>Add to Home screen</b>.","Натисни менюто <span class='k'>⋮</span> на браузъра и избери <b>Инсталирай приложението</b> или <b>Добави към началния екран</b>."],
 ios:["Pulsa <b>Compartir</b> <span class='k'><svg width='13' height='15' viewBox='0 0 13 15' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M6.5 1v8.5M3.5 4l3-3 3 3M4 6.5H2.5v7h8v-7H9'/></svg></span> abajo, baja y elige <b>Añadir a pantalla de inicio</b>. Luego ábrela desde su icono.","Tap <b>Share</b> <span class='k'><svg width='13' height='15' viewBox='0 0 13 15' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M6.5 1v8.5M3.5 4l3-3 3 3M4 6.5H2.5v7h8v-7H9'/></svg></span> below, scroll down and choose <b>Add to Home Screen</b>. Then open it from its icon.","Натисни <b>Сподели</b> <span class='k'><svg width='13' height='15' viewBox='0 0 13 15' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M6.5 1v8.5M3.5 4l3-3 3 3M4 6.5H2.5v7h8v-7H9'/></svg></span> долу, превърти и избери <b>Добави към началния екран</b>. После я отвори от иконата."],
 ipad:["Pulsa <b>Compartir</b> <span class='k'><svg width='13' height='15' viewBox='0 0 13 15' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M6.5 1v8.5M3.5 4l3-3 3 3M4 6.5H2.5v7h8v-7H9'/></svg></span> arriba a la derecha y elige <b>Añadir a pantalla de inicio</b>.","Tap <b>Share</b> <span class='k'><svg width='13' height='15' viewBox='0 0 13 15' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M6.5 1v8.5M3.5 4l3-3 3 3M4 6.5H2.5v7h8v-7H9'/></svg></span> at the top right and choose <b>Add to Home Screen</b>.","Натисни <b>Сподели</b> <span class='k'><svg width='13' height='15' viewBox='0 0 13 15' fill='none' stroke='currentColor' stroke-width='1.6' stroke-linecap='round' stroke-linejoin='round'><path d='M6.5 1v8.5M3.5 4l3-3 3 3M4 6.5H2.5v7h8v-7H9'/></svg></span> горе вдясно и избери <b>Добави към началния екран</b>."],
 iosx:["Para instalarla, abre este enlace en <b>Safari</b> y pulsa <b>Compartir → Añadir a pantalla de inicio</b>.","To install it, open this link in <b>Safari</b> and tap <b>Share → Add to Home Screen</b>.","За да я инсталираш, отвори връзката в <b>Safari</b> и натисни <b>Сподели → Добави към началния екран</b>."],
 copy:["Copiar enlace","Copy link","Копирай връзката"],
 copied:["Enlace copiado ✓","Link copied ✓","Връзката е копирана ✓"]};
const LK='mis-gastos-inst-hide';
const li=()=>{let l=(document.documentElement.lang||'es').slice(0,2);try{const v=(localStorage.getItem('mis-gastos-lang')||'').replace(/"/g,'');if(v)l=v}catch(e){}return({es:0,en:1,bg:2})[l]??0};
const tx=k=>T[k][li()];
const ua=navigator.userAgent||'';
const standalone=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone===true;
const isIPad=/iPad/.test(ua)||(/Macintosh/.test(ua)&&navigator.maxTouchPoints>1);
const isIOS=/iPhone|iPod/.test(ua)||isIPad;
const isAndroid=/Android/.test(ua);
const iosSafari=isIOS&&/Safari/.test(ua)&&!/CriOS|FxiOS|EdgiOS|OPiOS|GSA|Instagram|FBAN|FBAV|Line\//.test(ua);
const force=/[?&]instalar\b/.test(location.search);
let hidden=false;try{const h=+localStorage.getItem(LK)||0;hidden=Date.now()<h}catch(e){}
let deferred=null;
const box=document.getElementById('inst'),arrow=document.getElementById('inst-arrow');
function close(days){box.classList.add('hidden');arrow.classList.add('hidden');try{localStorage.setItem(LK,String(Date.now()+days*864e5))}catch(e){}}
document.getElementById('inst-x').onclick=()=>close(3);
function btn(label,cls,fn){const b=document.createElement('button');b.className='btn'+(cls?' '+cls:'');b.type='button';b.textContent=label;b.onclick=fn;document.getElementById('inst-act').appendChild(b);return b}
function show(body,{actions=true,arrowPos=null,top=false}={}){
 if(standalone||(hidden&&!force))return;
 document.getElementById('inst-t').textContent=tx('t');document.getElementById('inst-b').innerHTML=body;
 document.getElementById('inst-act').innerHTML='';box.classList.toggle('top',top);box.classList.remove('hidden');
 box.classList.toggle('up',arrowPos==='b');if(arrowPos){arrow.classList.toggle('tr',arrowPos==='tr');arrow.textContent=arrowPos==='tr'?'⬆':'⬇';arrow.classList.remove('hidden')}
 return actions}
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferred=e;
 if(show(tx('and'))){btn(tx('later'),'ghost',()=>close(3));btn(tx('btn'),'',async()=>{try{deferred.prompt();const r=await deferred.userChoice;if(r&&r.outcome==='accepted')close(3650)}catch(_){}deferred=null;box.classList.add('hidden')})}});
window.addEventListener('appinstalled',()=>close(3650));
setTimeout(()=>{if(deferred||standalone||!box.classList.contains('hidden'))return;
 if(iosSafari){show(isIPad?tx('ipad'):tx('ios'),{arrowPos:isIPad?'tr':'b',top:isIPad})}
 else if(isIOS){if(show(tx('iosx')))btn(tx('copy'),'',async e=>{try{await navigator.clipboard.writeText(location.origin+location.pathname);e.target.textContent=tx('copied')}catch(_){}})}
 else if(isAndroid){show(tx('andm'))}
},2500);
})();
</script>
